<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorveteria Creamn'ice</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="cabecalho">
        <h1 id="titulo">Sorveteria Creamn'Ice</h1>
        <p>Um sabor pra cada sorriso</p>
    </header>

    <nav id="nav">
        <a href="#" class="menu-item">Home</a>
        <a href="#" class="menu-item">Cardápio</a>
        <a href="#" class="menu-item">Contato</a>
    </nav>

    <main>
        <section id="destaque">
            <h2>Sorvete gelado todos os dias</h2>
            <p>Receba em menos de uma hora</p>
            <button class="btn-pedir">Pedir agora</button>
        </section>

        <h2 class="sessao-titulo">Sorvetes em Promoção</h2>
        <section class="container-produtos">
            <div class="card-produto">
                <p class="nome-produto">Sorvete de Cookie</p>
                <img src="../imagem/cookie.png" alt="Sorvete de cookie" class="img-produto">
            </div>
            
            <div class="card-produto">
                <p class="nome-produto">Sorvete de Pistache</p>
                <img src="../imagem/pistache.png" alt="Sorvete de pistache" class="img-produto">
            </div>

            <div class="card-produto">
                <p class="nome-produto">Sundae Arco-Íris</p>
                <img src="../imagem/arcoiris.png" alt="Sundae Arco-Íris" class="img-produto">
                <p class="preco">R$ 9,90</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Sorveteria Creamn'Ice</p>
    </footer>
</body>
</html>
